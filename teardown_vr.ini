[general]
enabled = yes
start_mode = stereo
require_steamvr = no
auto_theater = no

[view]
fov_mode = full
fixed_hfov = 110
ipd_scale = 1.0
world_scale = 1.0

[controls]
turn_mode = snap
snap_angle = 30
smooth_speed = 90
left_handed = no
aim_mode = hand

[render]
sharpen = 0.7

[hands]
hand_style = gloves
hand_texture = skin
hand_physics = yes
hand_collision = yes
hand_punch = yes
hand_steady = yes
grab_max_mass = 120
hand_strength = normal

[body]
show_body = yes
body_turn = yes
body_collision = yes

[misc]
scope_zoom = no
haptic_scale = 1.0
theater_distance = 2.5
theater_width = 2.0
